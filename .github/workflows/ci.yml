name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: token contrast
        run: npm run check:contrast

      # Catches an upstream basemap style whose boundary layers changed
      # shape. A style this cannot filter would otherwise render the
      # provider's own depiction of India's borders.
      - name: india borders
        run: npm run check:borders

      - name: formatting
        run: npm run format:check

      - name: build
        run: npm run build
